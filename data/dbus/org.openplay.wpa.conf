<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Allow users in the netdev group to access wpa_supplicant for Wi-Fi Direct
       (Miracast). Group membership is the whole access-control story here: add
       the user to netdev, or Wi-Fi Direct stays unavailable. -->
  <policy group="netdev">
    <allow send_destination="fi.w1.wpa_supplicant1"/>
    <allow receive_sender="fi.w1.wpa_supplicant1"/>
  </policy>

  <!-- There is deliberately NO <policy context="default"> fallback here.
       It used to allow send_destination to fi.w1.wpa_supplicant1, and it was
       either useless or a hole depending only on where this file got installed:

         /usr/share/dbus-1/system.d/  (where the .deb puts it)
             "org.openplay.wpa.conf" sorts before "wpa_supplicant.conf", so
             wpa_supplicant's own context="default" deny is read last and wins.
             The allow was a no-op.

         /etc/dbus-1/system.d/        (what docs/packaging.md tells users to use)
             /etc is read AFTER /usr/share, so OpenPlay's allow was read last
             and won instead. That handed *every* local uid — unprivileged
             service accounts included — full method-call access to
             wpa_supplicant: scan, add/remove networks, reconfigure Wi-Fi.

       A fallback that is dead in one location and a privilege escalation in the
       other is not a fallback. Grant access by netdev membership only. -->
</busconfig>
